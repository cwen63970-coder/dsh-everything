<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="dsh-everything">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132b47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f3350" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>

  <circle cx="1050" cy="60" r="150" fill="#58a6ff" opacity="0.08"/>
  <circle cx="140" cy="250" r="120" fill="#7ee787" opacity="0.07"/>

  <text x="600" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#e6edf3">dsh-everything</text>
  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">Everything 搜索 · 装进 DeepSeek Harness 的一个 bundle</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
    <rect x="424" y="202" width="120" height="34" rx="17" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="484" y="224" text-anchor="middle" fill="#c9d1d9">Windows</text>
    <rect x="556" y="202" width="96" height="34" rx="17" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="604" y="224" text-anchor="middle" fill="#c9d1d9">MCP</text>
    <rect x="664" y="202" width="112" height="34" rx="17" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="720" y="224" text-anchor="middle" fill="#c9d1d9">5 tools</text>
  </g>
</svg>
